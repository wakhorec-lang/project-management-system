<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Project Management App</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Signup</h1>

      <input type="text"
             id="name"
             placeholder="Enter Name">

      <input type="email"
             id="email"
             placeholder="Enter Email">

      <input type="password"
             id="password"
             placeholder="Enter Password">

      <select id="role">

        <option value="member">
          Member
        </option>

        <option value="admin">
          Admin
        </option>

      </select>

      <button onclick="signup()">
        Signup
      </button>

      <hr>

      <h1>Login</h1>

      <input type="email"
             id="loginEmail"
             placeholder="Enter Email">

      <input type="password"
             id="loginPassword"
             placeholder="Enter Password">

      <button onclick="login()">
        Login
      </button>

      <p id="message"></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
